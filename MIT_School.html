<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MIT School Chatbot</title>
  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: #f5f7fa;
    }

    /* ✅ Light clean theme */
    df-messenger {
      --df-messenger-bot-message: #f2f4f8;       /* light gray bot bubble */
      --df-messenger-user-message: #dce7ff;      /* soft light blue user bubble */
      --df-messenger-font-color: #000;
      --df-messenger-send-icon: #4a4a4a;
      --df-messenger-chat-background-color: #ffffff;
      --df-messenger-input-box-color: #ffffff;
      --df-messenger-titlebar-color: #ffffff;    /* white header */
      --df-messenger-titlebar-font-color: #333;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      transform: scale(0.8); /* medium size */
      transform-origin: bottom right;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
    }

    /* ✅ Header with logo */
    df-messenger::part(titlebar) {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid #e0e0e0;
    }

    df-messenger::part(title)::before {
      content: "";
      width: 26px;
      height: 26px;
      background-image: url('https://vectorjungal.com/files/preview/960x960/11723056345mhq9h5tfdzeentbyedqxsvgp3s3ujbj7exncjcok6k0eclkuslsykwbgk5gjz1zlyoqahlakgvhrswfyaj4dr8m3mugtewmjqbvf.png');
      background-size: cover;
      background-position: center;
      border-radius: 50%;
    }

    /* ✅ Make text smaller and cleaner */
    df-messenger::part(chat-message) {
      font-size: 14px;
      line-height: 1.4;
      padding: 6px 10px !important;
    }

    /* ✅ Mobile view */
    @media (max-width: 600px) {
      df-messenger {
        transform: scale(0.95);
        right: 10px;
        bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- Dialogflow Messenger -->
  <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

  <df-messenger
    intent="WELCOME"
    chat-title="MIT School Assistant"
    agent-id="af7f9606-eeb0-4a44-a1c8-15d2880b6a4b"
    language-code="en"></df-messenger>
</body>
</html>
