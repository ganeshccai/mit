<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MIT School Chatbot</title>
  <style>
    body {
      font-family: "Inter", sans-serif;
      margin: 0;
      background: #f5f7fa;
    }

    /* Dialogflow Messenger core style */
    df-messenger {
      --df-messenger-bot-message: #f1f6fb;   /* very light blue for bot */
      --df-messenger-user-message: #0b5394;  /* MIT theme blue */
      --df-messenger-font-color: #000;
      --df-messenger-chat-background-color: #ffffff;
      --df-messenger-send-icon: #0b5394;
      --df-messenger-input-placeholder-color: #888;
      --df-messenger-titlebar-color: #0b5394;
      --df-messenger-titlebar-font-color: #fff;
      --df-messenger-input-box-color: #ffffff;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
    }

    /* Header bar */
    df-messenger::part(titlebar) {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background-color: #0b5394;
    }

    df-messenger::part(title) {
      font-size: 15px;
      font-weight: 600;
    }

    df-messenger::part(title)::before {
      content: "";
      width: 26px;
      height: 26px;
      background-image: url('https://cdn-icons-png.flaticon.com/512/3135/3135715.png');
      background-size: cover;
      background-position: center;
      border-radius: 50%;
    }

    /* Make chat bubbles smaller (leaner look) */
    df-messenger::part(chat-message) {
      max-width: 80%;
      font-size: 14px;
      line-height: 1.3;
      border-radius: 12px !important;
      padding: 6px 10px !important;
    }

    /* User message text color for readability */
    df-messenger::part(user-message) {
      color: #fff !important;
    }

    /* Mobile friendly */
    @media (max-width: 600px) {
      df-messenger {
        bottom: 10px;
        right: 10px;
        width: 90%;
        height: 75%;
      }
    }
  </style>
</head>
<body>
  <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
  <df-messenger
    intent="WELCOME"
    chat-title="MIT School Assistant"
    agent-id="af7f9606-eeb0-4a44-a1c8-15d2880b6a4"
    language-code="en"
  ></df-messenger>
</body>
</html>
